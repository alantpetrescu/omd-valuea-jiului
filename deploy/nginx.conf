# nginx in front of the SPA and the API.
#
# Tailscale terminates TLS and forwards here over the loopback of the shared
# network namespace, so this server block speaks plain HTTP on 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The campaigns package is ~1.25 MB because visuals travel as base64, and a
    # real one will be larger. nginx defaults to 1 MB, which would reject the
    # import with 413 before it ever reaches the API — keep this above
    # MAX_JSON_IMPORT_MB.
    client_max_body_size 32m;

    # Long-running imports decode base64 and move files inside one transaction.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's own liveness, distinct from the API's.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tailscale served the request over HTTPS; tell the app so it treats the
        # connection as secure (session cookies are Secure in production).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # API responses are per-user and already send Cache-Control: no-store.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Uploaded visuals are served straight from the shared volume rather than
    # through Node. `storage_path` stays an opaque key; this is the only place
    # it becomes a public URL.
    location /uploads/ {
        alias /data/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed build assets never change content under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — required by spec section 42 so a direct refresh on
    # /campaigns/camp-002 returns the app instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy leaves clients on stale JS.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
}
