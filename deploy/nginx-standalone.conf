# nginx in front of the SPA and the API, on an ordinary server.
#
# This is the plain-VPS counterpart of deploy/nginx.conf, which targets the
# Docker + Tailscale stack. Differences that matter:
#
#   - nginx terminates TLS here, so X-Forwarded-Proto comes from $scheme rather
#     than being hardcoded to https. Hardcoding is only safe when something
#     upstream is guaranteed to have terminated TLS already.
#   - /uploads is served from the repository's storage directory, not /data.
#   - listens on 80/443 rather than 8080.
#
# Install:
#   sudo cp deploy/nginx-standalone.conf /etc/nginx/sites-available/omd
#   sudo ln -s /etc/nginx/sites-available/omd /etc/nginx/sites-enabled/omd
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace omd.example.ro and /srv/omd throughout.

server {
    listen 80;
    listen [::]:80;
    server_name omd.example.ro;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name omd.example.ro;

    ssl_certificate     /etc/letsencrypt/live/omd.example.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omd.example.ro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # The built SPA: frontend/dist copied here by the deploy step.
    root /srv/omd/web;
    index index.html;

    # A campaigns export/import package carries base64 visuals and runs past
    # 1 MB easily. nginx's default would 413 it before the API sees it, so this
    # must stay above MAX_JSON_IMPORT_MB.
    client_max_body_size 32m;

    # Imports decode base64 and move files inside one transaction.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    access_log /var/log/nginx/omd.access.log;
    error_log  /var/log/nginx/omd.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers.
    #
    # Declared inside each location that needs them rather than once at server
    # level: add_header does NOT inherit into a location that declares its own,
    # so a single server-level block would silently vanish from /assets/,
    # /uploads/ and index.html. Repetition here is deliberate.
    set $sec_headers 1;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme, not a hardcoded https: this server also answers on :80.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Responses are user-scoped and already carry Cache-Control: no-store.
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Uploaded visuals, straight off disk. storage_path stays an opaque key;
    # this is the only place it becomes a public URL.
    location /uploads/ {
        alias /srv/omd/storage/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        # Never let an uploaded file execute or render as a document.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Self-hosted webfonts, also content-stable.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients running the
    # previous bundle against the new API.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        # Everything the app loads is same-origin: no CDN, no inline scripts.
        # 'unsafe-inline' for style-src only because React sets element styles.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback, so a refresh on /campaigns/camp-002 returns the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
